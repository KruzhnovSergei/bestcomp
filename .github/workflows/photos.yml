name: Фото товаров
# Примерно раз в сутки ищет фото для товаров без фото (build/photos.mjs) и сохраняет их в img/.
# Нужны секреты репозитория: BRAVE_API_KEY (Brave Search API) и GEMINI_API_KEY (Google AI Studio).
# Сколько товаров за раз — переменная PHOTO_LIMIT в Settings → Secrets and variables → Actions → Variables (по умолчанию 30).
on:
  schedule:
    # GitHub выполняет расписание «по возможности»: из ежечасных запусков реально проходят 2–4 в сутки,
    # а ежедневные часто пропускает совсем. Поэтому проверка каждый час, а поиск — только если
    # с прошлого поиска прошло больше 20 часов (шаг «Пора искать?»). Пустая проверка занимает секунды.
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # запустить сборку сайта после новых фото
concurrency:
  group: photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Пора искать?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/commits?path=img/index.json&per_page=1" --jq '.[0].commit.committer.date')
          age=$(( ( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) ) / 3600 ))
          echo "Последний поиск: $last ($age ч назад)"
          if [ "$age" -lt 20 ]; then echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == '1'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
      - name: Установить sharp
        if: steps.gate.outputs.go == '1'
        run: npm install --no-save --no-package-lock sharp@0.34
      - name: Искать фото
        if: steps.gate.outputs.go == '1'
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHOTO_LIMIT: ${{ vars.PHOTO_LIMIT || '30' }}
        run: node build/photos.mjs
      - name: Сохранить фото
        if: always() && steps.gate.outputs.go == '1'
        run: |
          git config user.name "Bestcomp photo bot"
          git config user.email "noreply@bestcomp.kg"
          git add img
          if git diff --cached --quiet; then echo "Новых фото нет"; exit 0; fi
          git commit -m "Фото товаров: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
      # пуш от имени бота сам сборку сайта не запускает (так устроен GitHub) — запускаем её явно
      - name: Обновить сайт
        if: always() && steps.gate.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main
