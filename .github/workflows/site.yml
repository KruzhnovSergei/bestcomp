name: Сборка и публикация сайта
# Каждый час (и после каждой правки) собирает страницы товаров, категорий и готовых ПК
# из базы и публикует сайт на bestcomp.kg. Нужно: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Собрать страницы
        run: node build/gen.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Пауза перед повтором
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      # GitHub иногда не успевает «увидеть» только что загруженный архив — тогда публикуем ещё раз
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
